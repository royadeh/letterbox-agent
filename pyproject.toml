[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "letterbox"
version = "0.1.0"
description = "Explains dense official letters in plain language (English and Farsi)."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2,<3",
    "langgraph>=1.2,<2",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["letterbox"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
